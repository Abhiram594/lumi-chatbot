<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #020204; overflow: hidden; margin: 0; }
  .star {
    position: absolute;
    left: 50%; top: 50%;
    width: 200px; height: 200px;
    margin-left: -100px; margin-top: -100px;
    background: 
      radial-gradient(ellipse 4% 100% at 50% 50%, rgba(255,255,255,0.9) 0%, rgba(255,215,0,0.8) 30%, rgba(255,165,0,0) 70%),
      radial-gradient(ellipse 100% 4% at 50% 50%, rgba(255,255,255,0.9) 0%, rgba(255,215,0,0.8) 30%, rgba(255,165,0,0) 70%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,1) 0%, rgba(255,215,0,1) 15%, rgba(255,165,0,0.5) 40%, rgba(255,140,0,0) 65%);
    animation: expand 2s infinite ease-in;
  }
  @keyframes expand {
    0% { transform: scale(0.1); }
    100% { transform: scale(15); }
  }
</style>
</head>
<body>
  <div class="star"></div>
</body>
</html>
